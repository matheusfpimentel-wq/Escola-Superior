  :root{
    /* Cores oficiais do Manual de Identidade Visual do MPPR */
    --azul:#3E519B;          /* azul institucional */
    --cinza:#828586;         /* cinza institucional */
    --navy:#262F4C;          /* fundo azul escuro do site institucional */
    --navy-claro:#2F3A5E;
    --azul-suave:#EAEDF7;
    --tinta:#1F2733;
    --texto-2:#4A5560;
    --linha:#DDE2EA;
    --fundo:#F3F5F8;
    --branco:#FFFFFF;
    --realce:#FFEFA8;

    --titulo:"MPPR Futura", "Futura PT", Futura, "Century Gothic", system-ui, sans-serif;
    --texto:Arial, Helvetica, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --raio:4px;
  }

  *,*::before,*::after{box-sizing:border-box; text-rendering:geometricPrecision;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--branco);
    color:var(--tinta);
    font-family:var(--texto);
    font-size:16px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
    /* preserva as metricas da Futura: sem isso, o hinting arredonda os
       avancos e abre buracos depois do "t" e do "T" em corpos pequenos */
    text-rendering:geometricPrecision;
  }

  .app{
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:520px;
    background:var(--branco);
  }
  .wrap{
    width:100%;
    max-width:940px;
    margin:0 auto;
    padding:0 22px;
  }

  /* ====== Faixa institucional ====== */
  .marca{
    flex:0 0 auto;
    position:relative;
    background:var(--navy);
    overflow:hidden;
  }
  /* corte diagonal, elemento grafico do manual */
  .marca::after{
    content:"";
    position:absolute;
    top:0; bottom:0; right:-8%;
    width:46%;
    background:linear-gradient(100deg, rgba(62,81,155,0) 0%, rgba(62,81,155,.30) 55%, rgba(62,81,155,.42) 100%);
    transform:skewX(-19deg);
    transform-origin:top right;
    pointer-events:none;
  }
  .marca .wrap{position:relative; z-index:1; padding-top:13px; padding-bottom:14px;}

  .assinatura{
    display:flex;
    align-items:center;
    gap:13px;
  }
  .logo{line-height:1;}
  .logo .sigla{
    font-family:var(--titulo);
    font-weight:700;
    font-size:1.62rem;
    letter-spacing:.005em;
    display:block;
  }
  .logo .sigla .mp{color:var(--branco);}
  .logo .sigla .pr{color:#6E80D0;}
  .logo .nome{
    display:block;
    font-family:var(--titulo);
    font-weight:600;
    font-size:.535rem;
    letter-spacing:.028em;
    color:rgba(255,255,255,.90);
    margin-top:1px;
  }
  .divisor{
    width:1px;
    align-self:stretch;
    background:rgba(255,255,255,.42);
    margin:1px 0;
  }
  .unidade{
    font-family:var(--titulo);
    font-weight:700;
    font-size:1.02rem;
    color:var(--branco);
    line-height:1.15;
    letter-spacing:.005em;
  }
  .unidade small{
    display:block;
    font-weight:400;
    font-size:.6rem;
    letter-spacing:.03em;
    color:rgba(255,255,255,.78);

  @media (prefers-reduced-motion:reduce){

<script>
(function(){

{"termo": "Adobe Firefly","categoria": "Ferramentas","definicao": "Ferramenta de geração e edição de imagens da Adobe, treinada com acervo licenciado, o que reduz a discussão sobre direitos autorais do resultado.","verTambem": ["Direitos autorais e IA","Midjourney"],"id": "adobe-firefly"},
{"id": "agente-de-ia","termo": "Agente de IA","categoria": "Conceitos e fundamentos","definicao": "Ferramenta de inteligência artificial capaz de executar uma tarefa em várias etapas de forma mais autônoma, e não apenas responder a uma pergunta. Exemplo: reunir informações de vários documentos e, ao final, gerar um relatório.","verTambem": ["Assistente virtual","Gems"]},
{"id": "ajuste-fino-fine-tuning","termo": "Ajuste fino (fine-tuning)","categoria": "Termos técnicos","definicao": "Processo de treinar um modelo já pronto com dados adicionais e específicos, para especializá-lo em um assunto ou tarefa. No MPPR, o uso de dados de processos para esse fim tem regras próprias conforme o grau de sigilo.","verTambem": ["Modelo de IA"]},
{"id": "alucinacao","termo": "Alucinação","categoria": "Riscos e limites","definicao": "Quando a ferramenta de IA gera uma informação falsa ou inexistente e a apresenta como verdadeira, de forma convincente. Pode inventar uma lei, um número, uma jurisprudência ou uma citação. É a principal razão pela qual toda resposta deve ser conferida em fonte oficial antes de qualquer uso.","verTambem": ["Verificação de fatos (fact-checking)"]},
{"termo": "Ancoragem em fontes (grounding)","categoria": "Uso e prompts","definicao": "Vinculação da resposta a documentos ou dados fornecidos, em vez do conhecimento geral do modelo, com indicação de onde cada informação foi obtida.","verTambem": ["RAG (geração aumentada por recuperação)","Base de conhecimento","Verificação de fatos (fact-checking)"],"id": "ancoragem-em-fontes-grounding"},
{"id": "anonimizacao","termo": "Anonimização","categoria": "Dados e conformidade","definicao": "Processo de remover de um documento os dados que permitem identificar uma pessoa, de forma definitiva, sem possibilidade de reverter. Difere da pseudonimização, em que a reidentificação ainda é possível.","verTambem": ["Pseudonimização","LGPD"]},
{"termo": "Antropomorfismo","categoria": "Riscos e limites","definicao": "Atribuir à ferramenta intenções, sentimentos ou compreensão que ela não possui. Leva a confiar demais na resposta e a interpretar mal os seus limites.","verTambem": ["Modelo de linguagem (LLM)","Caixa-preta (black box)"],"id": "antropomorfismo"},
{"id": "api","termo": "API","categoria": "Termos técnicos","definicao": "Sigla, em inglês, para interface de programação. É a \"ponte\" que permite que um programa converse e troque informações com outro. Na prática, é o que possibilita integrar a inteligência artificial a outros sistemas.","verTambem": ["Plugin (extensão)"]},
{"id": "apps-script","termo": "Apps Script","categoria": "Ferramentas","definicao": "Ferramenta de programação simples do Google que permite automatizar tarefas dentro do Google Workspace, como planilhas, documentos e e-mails.","verTambem": ["Automação"]},
{"id": "aprendizado-de-maquina-machine-learning","termo": "Aprendizado de máquina (machine learning)","categoria": "Conceitos e fundamentos","definicao": "Método pelo qual um programa \"aprende\" padrões a partir de exemplos, em vez de seguir regras escritas manualmente por uma pessoa. É a base da inteligência artificial atual.","verTambem": ["Aprendizado profundo (deep learning)"]},
{"id": "aprendizado-por-reforco-com-feedback-humano-rlhf","termo": "Aprendizado por reforço com feedback humano (RLHF)","categoria": "Termos técnicos","definicao": "Técnica em que pessoas avaliam as respostas do modelo, e essas avaliações são usadas para aperfeiçoá-lo, tornando-o mais útil e seguro.","verTambem": ["Aprendizado de máquina (machine learning)"]},
{"id": "aprendizado-profundo-deep-learning","termo": "Aprendizado profundo (deep learning)","categoria": "Termos técnicos","definicao": "Ramo do aprendizado de máquina que usa redes neurais com muitas camadas para reconhecer padrões complexos. É a base das ferramentas de IA atuais.","verTambem": ["Rede neural","Aprendizado de máquina (machine learning)"]},
{"id": "artefato","termo": "Artefato","categoria": "Uso e prompts","definicao": "Conteúdo estruturado (um documento, uma tabela, um trecho de código) que algumas ferramentas de IA geram e exibem em um painel próprio, separado da conversa, para você editar e reaproveitar.","verTambem": ["Canvas"]},
{"id": "assistente-virtual","termo": "Assistente virtual","categoria": "Conceitos e fundamentos","definicao": "Programa que ajuda o usuário a realizar tarefas por meio de conversa: responder perguntas, organizar informações ou redigir textos. Gemini e ChatGPT são exemplos.","verTambem": ["Chatbot","Agente de IA"]},
{"id": "automacao","termo": "Automação","categoria": "Ferramentas","definicao": "Uso de tecnologia para executar tarefas repetitivas de forma automática, com pouca ou nenhuma intervenção manual. Exemplo: gerar e enviar ofícios em série.","verTambem": ["Fluxo de trabalho (workflow)"]},
{"id": "avaliacao-de-impacto-algoritmico","termo": "Avaliação de impacto algorítmico","categoria": "Dados e conformidade","definicao": "Análise feita antes de adotar uma solução de IA considerada de risco mais alto, para medir seus possíveis efeitos sobre direitos das pessoas. No MPPR, cabe a uma área técnica específica conduzi-la.","verTambem": ["DAIAC"]},
{"termo": "Avaliação (eval)","categoria": "Riscos e limites","definicao": "Teste sistemático das respostas de uma ferramenta em casos representativos do trabalho real, para medir o acerto antes de adotá-la em escala.","verTambem": ["Benchmark","IA como avaliadora (LLM as judge)"],"id": "avaliacao-eval"},
{"termo": "Bajulação (sycophancy)","categoria": "Riscos e limites","definicao": "Tendência do modelo a concordar com o usuário e reforçar o que ele parece querer ouvir, em vez de apontar o erro. Costuma aparecer quando se insiste em uma tese equivocada.","verTambem": ["Viés (algorítmico)","Verificação de fatos (fact-checking)"],"id": "bajulacao-sycophancy"},
{"termo": "Banco de dados vetorial","categoria": "Termos técnicos","definicao": "Base que armazena embeddings e permite localizar trechos por proximidade de significado, e não por palavra exata. Sustenta as ferramentas que respondem com base em acervos de documentos.","verTambem": ["Embedding (vetor)","RAG (geração aumentada por recuperação)","Chunk (fragmento)"],"id": "banco-de-dados-vetorial"},
{"id": "banco-de-prompts","termo": "Banco de Prompts","categoria": "Ferramentas","definicao": "Coleção de comandos já testados e organizados, disponibilizada pelo MPPR, para que membros e servidores reaproveitem em tarefas do dia a dia sem precisar escrever tudo do zero.","verTambem": ["Prompt"]},
{"id": "base-de-conhecimento","termo": "Base de conhecimento","categoria": "Uso e prompts","definicao": "Conjunto de documentos confiáveis que você fornece à IA para que ela responda com base neles. É o que permite respostas mais precisas e verificáveis.","verTambem": ["RAG (geração aumentada por recuperação)","NotebookLM"]},

{"id": "biometria","termo": "Biometria","categoria": "Dados e conformidade","definicao": "Identificação de uma pessoa por características físicas, como rosto, digital ou voz. No MPPR, o uso de IA para reconhecimento de emoções por biometria é vedado.","verTambem": ["Resolução PGJ 6031/2026"]},
{"termo": "Cache de prompt (prompt caching)","categoria": "Termos técnicos","definicao": "Reaproveitamento do processamento de trechos que se repetem a cada pedido, como um documento longo reenviado em várias perguntas. Reduz custo e tempo de resposta.","verTambem": ["Token","Contexto (janela de contexto)"],"id": "cache-de-prompt-prompt-caching"},
{"termo": "Cadeia de prompts (prompt chaining)","categoria": "Uso e prompts","definicao": "Divisão de uma tarefa complexa em comandos encadeados, em que a saída de um alimenta o seguinte. Dá mais controle sobre o resultado e facilita conferir cada etapa.","verTambem": ["Fluxo de trabalho (workflow)","Engenharia de prompt"],"id": "cadeia-de-prompts-prompt-chaining"},
{"id": "caixa-preta-black-box","termo": "Caixa-preta (black box)","categoria": "Riscos e limites","definicao": "Expressão que descreve a dificuldade de saber exatamente como a IA chegou a um resultado. Mesmo quem desenvolve a ferramenta nem sempre consegue explicar cada resposta.","verTambem": ["Explicabilidade"]},
{"id": "canvas","termo": "Canvas","categoria": "Uso e prompts","definicao": "Modo de trabalho, presente em algumas ferramentas, em que o texto ou código gerado aparece em um painel separado da conversa, permitindo editar e revisar aos poucos, lado a lado com o chat. Em algumas ferramentas, recurso semelhante é chamado de Artifacts.","verTambem": ["Artefato"]},
{"termo": "Chamada de ferramentas (function calling)","categoria": "Termos técnicos","definicao": "Mecanismo pelo qual o modelo aciona um programa externo, como uma busca, uma calculadora ou um sistema interno, e usa o resultado na resposta. É o que permite à IA fazer mais do que escrever texto.","verTambem": ["Harness (arcabouço de execução)","API","MCP (Protocolo de Contexto de Modelo)"],"id": "chamada-de-ferramentas-function-calling"},
{"id": "chatbot","termo": "Chatbot","categoria": "Conceitos e fundamentos","definicao": "Programa que conversa com o usuário por texto, em linguagem comum, respondendo a perguntas e pedidos. As ferramentas de IA generativa, como Gemini e ChatGPT, funcionam nesse formato.","verTambem": ["Assistente virtual","Agente de IA"]},
{"id": "chatgpt","termo": "ChatGPT","categoria": "Ferramentas","definicao": "Ferramenta de IA generativa desenvolvida pela empresa OpenAI. No curso, é usada para ensinar conceitos gerais de inteligência artificial. Não é ferramenta oficial do MPPR, portanto não deve receber dados de processos ou informações sigilosas.","verTambem": ["Ferramenta homologada (institucional)"]},
{"id": "chunk-fragmento","termo": "Chunk (fragmento)","categoria": "Termos técnicos","definicao": "Pedaço em que um documento longo é dividido para que a IA consiga processá-lo por partes. Aparece no funcionamento das ferramentas que respondem com base em arquivos.","verTambem": ["RAG (geração aumentada por recuperação)","Embedding (vetor)"]},
{"id": "claude","termo": "Claude","categoria": "Ferramentas","definicao": "Ferramenta de IA generativa desenvolvida pela empresa Anthropic. Assim como o ChatGPT, é uma ferramenta externa e não deve receber dados institucionais sigilosos.","verTambem": ["Ferramenta externa (não homologada)"]},
{"termo": "Claude Code","categoria": "Ferramentas","definicao": "Ferramenta da Anthropic que funciona como agente no terminal, lendo e alterando os arquivos de um projeto sob comando do usuário. Voltada a desenvolvimento de software.","verTambem": ["Claude","Agente de IA","Harness (arcabouço de execução)"],"id": "claude-code"},
{"id": "codigo-aberto-open-source","termo": "Código aberto (open source)","categoria": "Termos técnicos","definicao": "Modelo de IA cujo funcionamento interno é disponibilizado publicamente, podendo ser usado e adaptado por qualquer pessoa. Opõe-se ao modelo proprietário, que é fechado e controlado por uma empresa.","verTambem": ["Modelo proprietário (fechado)"]},
{"id": "comando","termo": "Comando","categoria": "Uso e prompts","definicao": "Outro nome para prompt: a instrução que você escreve para a ferramenta de IA executar uma tarefa.","verTambem": ["Prompt","Engenharia de prompt"]},
{"id": "conta-institucional","termo": "Conta institucional","categoria": "Dados e conformidade","definicao": "Conta de acesso fornecida pela instituição (por exemplo, o e-mail do MPPR). É por meio dela que se usa a ferramenta oficial de IA com garantia de sigilo. Ferramentas usadas fora da conta institucional não oferecem essa proteção.","verTambem": ["Ferramenta homologada (institucional)","Dado sigiloso"]},
{"id": "contexto-janela-de-contexto","termo": "Contexto (janela de contexto)","categoria": "Uso e prompts","definicao": "Quantidade de informação que a ferramenta consegue \"levar em conta\" de uma só vez em uma conversa. Quando o texto é muito longo, partes mais antigas podem deixar de ser consideradas.","verTambem": ["Token"]},
{"id": "copilot","termo": "Copilot","categoria": "Ferramentas","definicao": "Ferramenta de IA generativa da empresa Microsoft, integrada a seus programas. É uma ferramenta externa, portanto não deve receber dados institucionais sigilosos.","verTambem": ["Ferramenta externa (não homologada)"]},
{"termo": "Corte de conhecimento (knowledge cutoff)","categoria": "Conceitos e fundamentos","definicao": "Data limite dos dados usados no treinamento do modelo. Fatos posteriores a ela só entram na resposta se a ferramenta consultar a internet ou se o usuário fornecer o documento. Explica respostas desatualizadas sobre legislação e jurisprudência recentes.","verTambem": ["Alucinação","Verificação de fatos (fact-checking)","RAG (geração aumentada por recuperação)"],"id": "corte-de-conhecimento-knowledge-cutoff"},
{"termo": "Cursor","categoria": "Ferramentas","definicao": "Editor de código com IA integrada, capaz de gerar e alterar trechos a partir de instruções em linguagem comum. É ferramenta externa.","verTambem": ["Claude Code","Agente de IA"],"id": "cursor"},
{"id": "dado-pessoal","termo": "Dado pessoal","categoria": "Dados e conformidade","definicao": "Qualquer informação que identifique ou permita identificar uma pessoa, como nome, CPF ou endereço. Recebe proteção legal específica.","verTambem": ["Dado sensível","LGPD","Anonimização"]},
{"id": "dado-sensivel","termo": "Dado sensível","categoria": "Dados e conformidade","definicao": "Categoria especial de dado pessoal que exige proteção reforçada: origem racial ou étnica, convicção religiosa, opinião política, dados de saúde, vida sexual e dados genéticos ou biométricos.","verTambem": ["Dado pessoal","LGPD"]},
{"id": "dado-sigiloso","termo": "Dado sigiloso","categoria": "Dados e conformidade","definicao": "Informação protegida por sigilo legal, como a de processos em segredo de justiça. Só pode ser inserida em ferramentas oficiais da instituição, que garantem a proteção.","verTambem": ["Ferramenta homologada (institucional)","Conta institucional"]},
{"id": "daiac","termo": "DAIAC","categoria": "Dados e conformidade","definicao": "Divisão de Análise e Inteligência Artificial Corporativa, área do Departamento de Tecnologia da Informação do MPPR responsável, entre outras funções, por classificar o risco das soluções de IA usadas na instituição.","verTambem": ["Avaliação de impacto algorítmico"]},
{"id": "deep-research-pesquisa-profunda","termo": "Deep Research (pesquisa profunda)","categoria": "Uso e prompts","definicao": "Recurso, presente em algumas ferramentas, em que a IA busca em muitas fontes de forma automática, por vários minutos, e entrega um relatório detalhado com as referências. Como qualquer saída de IA, exige conferência das fontes.","verTambem": ["Alucinação","Verificação de fatos (fact-checking)"]},
{"id": "deepfake","termo": "Deepfake","categoria": "Riscos e limites","definicao": "Áudio, imagem ou vídeo falso, criado por IA, que imita de forma convincente uma pessoa real. Usado para desinformação e fraudes.","verTambem": []},
{"termo": "DeepSeek","categoria": "Ferramentas","definicao": "Família de modelos desenvolvida pela empresa chinesa de mesmo nome, parte deles com pesos abertos. É ferramenta externa, e o envio de dados a servidores no exterior pede cautela redobrada.","verTambem": ["Ferramenta externa (não homologada)","Pesos (weights)"],"id": "deepseek"},
{"id": "degravacao","termo": "Degravação","categoria": "Ferramentas","definicao": "Transcrição de um áudio ou vídeo em texto escrito. No MPPR, é feita com apoio de IA pela ferramenta Hermes.","verTambem": ["Hermes","Reconhecimento de voz (speech-to-text)"]},
{"termo": "Destilação (distillation)","categoria": "Termos técnicos","definicao": "Treinamento de um modelo menor a partir das respostas de um modelo maior, para obter desempenho próximo a um custo bem menor.","verTambem": ["Ajuste fino (fine-tuning)","Modelo de IA"],"id": "destilacao-distillation"},
{"id": "direitos-autorais-e-ia","termo": "Direitos autorais e IA","categoria": "Dados e conformidade","definicao": "Discussão jurídica sobre a titularidade e o uso de obras produzidas ou utilizadas por inteligência artificial. No MPPR, o integrante deve observar os direitos autorais ao empregar conteúdo gerado por IA.","verTambem": ["Resolução PGJ 6031/2026"]},
{"termo": "ElevenLabs","categoria": "Ferramentas","definicao": "Ferramenta de síntese e de clonagem de voz. Reproduzir a voz de uma pessoa real sem autorização pode configurar ilícito e não deve ser feito em material institucional.","verTambem": ["Deepfake","Reconhecimento de voz (speech-to-text)"],"id": "elevenlabs"},
{"id": "embedding-vetor","termo": "Embedding (vetor)","categoria": "Termos técnicos","definicao": "Representação numérica de um texto que permite à IA comparar significados e encontrar conteúdos parecidos, mesmo com palavras diferentes. É a base das buscas por sentido usadas em ferramentas que consultam documentos.","verTambem": ["RAG (geração aumentada por recuperação)","Chunk (fragmento)"]},
{"termo": "Engenharia de contexto","categoria": "Uso e prompts","definicao": "Prática de decidir o que entra na janela de contexto do modelo e em que ordem: instruções, documentos, histórico da conversa e resultados de ferramentas. Vai além da redação do comando, porque trata do conjunto de informações disponível a cada resposta.","verTambem": ["Contexto (janela de contexto)","Engenharia de prompt","RAG (geração aumentada por recuperação)"],"id": "engenharia-de-contexto"},
{"id": "engenharia-de-prompt","termo": "Engenharia de prompt","categoria": "Uso e prompts","definicao": "Técnica de escrever comandos de forma mais clara e estruturada para obter respostas melhores da IA. Inclui dar contexto, exemplos e instruções precisas sobre formato e tom.","verTambem": ["Prompt","Exemplos no prompt (zero-shot e few-shot)"]},
{"termo": "Envenenamento de dados (data poisoning)","categoria": "Riscos e limites","definicao": "Inserção deliberada de conteúdo falso ou malicioso nos dados de treinamento ou nas fontes que a IA consulta, para distorcer as respostas que ela produz.","verTambem": ["Prompt injection","Viés (algorítmico)"],"id": "envenenamento-de-dados-data-poisoning"},
{"id": "escore-de-risco-risk-scoring","termo": "Escore de risco (risk scoring)","categoria": "Dados e conformidade","definicao": "Nota ou pontuação atribuída por um sistema para estimar a probabilidade de um evento futuro. No MPPR, é vedado usar IA para prever a chance de alguém cometer crime.","verTambem": ["IA preditiva","Resolução PGJ 6031/2026"]},
{"id": "exemplos-no-prompt-zero-shot-e-few-shot","termo": "Exemplos no prompt (zero-shot e few-shot)","categoria": "Uso e prompts","definicao": "Formas de escrever um comando. No \"zero-shot\", você pede a tarefa sem dar exemplos. No \"few-shot\", você inclui alguns exemplos do resultado desejado, o que costuma melhorar a resposta.","verTambem": ["Engenharia de prompt"]},
{"id": "explicabilidade","termo": "Explicabilidade","categoria": "Riscos e limites","definicao": "Capacidade de entender e justificar como um sistema de IA chegou a determinado resultado. Importante para decisões que afetam direitos.","verTambem": ["Caixa-preta (black box)"]},
{"id": "ferramenta-externa-nao-homologada","termo": "Ferramenta externa (não homologada)","categoria": "Dados e conformidade","definicao": "Ferramenta de IA fornecida por terceiros que não foi aprovada pela instituição e não oferece garantia de sigilo. Não deve receber dados institucionais.","verTambem": ["Ferramenta homologada (institucional)"]},
{"id": "ferramenta-homologada-institucional","termo": "Ferramenta homologada (institucional)","categoria": "Dados e conformidade","definicao": "Ferramenta de IA contratada ou aprovada pelo MPPR, com garantia de segurança e sigilo. É a única em que se pode inserir dados de trabalho da instituição. No MPPR, a ferramenta oficial de IA generativa é o Gemini.","verTambem": ["Gemini","Conta institucional"]},
{"id": "fluxo-de-trabalho-workflow","termo": "Fluxo de trabalho (workflow)","categoria": "Uso e prompts","definicao": "Sequência de etapas para concluir uma tarefa. Ao usar IA, é o encadeamento de comandos e conferências que leva do pedido inicial ao resultado final.","verTambem": ["Automação","Agente de IA"]},
{"termo": "Gamma","categoria": "Ferramentas","definicao": "Ferramenta que monta apresentações e documentos visuais a partir de um texto ou de um roteiro. É externa.","verTambem": ["Visual Law","Ferramenta externa (não homologada)"],"id": "gamma"},
{"id": "gemini","termo": "Gemini","categoria": "Ferramentas","definicao": "Ferramenta de IA generativa desenvolvida pelo Google e adotada oficialmente pelo MPPR, integrada ao Google Workspace. É a ferramenta em que se pode trabalhar com dados institucionais.","verTambem": ["Google Workspace","Ferramenta homologada (institucional)"]},
{"id": "gems","termo": "Gems","categoria": "Ferramentas","definicao": "Assistentes personalizados criados dentro do Gemini para uma tarefa específica, com instruções fixas definidas pelo usuário. Evitam ter de repetir o mesmo comando toda vez.","verTambem": ["Gemini","Skill"]},
{"termo": "Google AI Studio","categoria": "Ferramentas","definicao": "Ambiente do Google para testar os modelos Gemini e ajustar parâmetros antes de levar o uso para um sistema. Voltado a quem desenvolve integrações.","verTambem": ["Gemini","API"],"id": "google-ai-studio"},
{"id": "google-workspace","termo": "Google Workspace","categoria": "Ferramentas","definicao": "Conjunto de ferramentas do Google usadas no trabalho: Gmail, Documentos, Planilhas, Drive, entre outras. É nele que o Gemini está integrado no MPPR.","verTambem": ["Gemini"]},
{"id": "gpt","termo": "GPT","categoria": "Conceitos e fundamentos","definicao": "Sigla, em inglês, para \"transformador generativo pré-treinado\". É o tipo de tecnologia por trás de ferramentas como o ChatGPT.","verTambem": ["Modelo de linguagem (LLM)"]},
{"termo": "Grok","categoria": "Ferramentas","definicao": "Ferramenta de IA generativa da empresa xAI, integrada à rede social X. É ferramenta externa, sem garantia de sigilo para dados institucionais.","verTambem": ["Ferramenta externa (não homologada)"],"id": "grok"},
{"termo": "Harness (arcabouço de execução)","categoria": "Termos técnicos","definicao": "Camada de software que envolve o modelo de linguagem e o transforma em uma ferramenta de trabalho: monta o prompt, dá acesso a arquivos e sistemas, executa as ferramentas chamadas, controla as etapas e aplica limites de segurança. Duas ferramentas com o mesmo modelo por trás podem entregar resultados bem diferentes por causa do harness. Ajustar essa camada é o que se costuma chamar de engenharia de harness.","verTambem": ["Loop de agente (ciclo do agente)","Agente de IA","Chamada de ferramentas (function calling)"],"id": "harness-arcabouco-de-execucao"},
{"id": "hermes","termo": "Hermes","categoria": "Ferramentas","definicao": "Ferramenta do MPPR que faz a degravação (transcrição de áudio e vídeo em texto) com apoio de inteligência artificial.","verTambem": ["Degravação"]},
{"termo": "IA como avaliadora (LLM as judge)","categoria": "Uso e prompts","definicao": "Uso de um modelo para avaliar respostas produzidas por outro, segundo critérios definidos por escrito. Acelera revisões em escala, mas herda os limites e vieses do avaliador.","verTambem": ["Avaliação (eval)","Benchmark"],"id": "ia-como-avaliadora-llm-as-judge"},
{"id": "ia-generativa","termo": "IA generativa","categoria": "Conceitos e fundamentos","definicao": "Tipo de inteligência artificial que cria conteúdo novo (texto, imagem, áudio, tabelas) a partir de instruções escritas pelo usuário. A diferença em relação a uma busca comum é importante: a busca localiza algo que já existe, enquanto a IA generativa produz uma resposta original a cada pedido, com base em padrões que aprendeu de grandes volumes de dados.","verTambem": ["IA (Inteligência Artificial)","IA preditiva"]},
{"id": "ia-inteligencia-artificial","termo": "IA (Inteligência Artificial)","categoria": "Conceitos e fundamentos","definicao": "Campo da tecnologia voltado a criar sistemas capazes de executar tarefas que, em geral, exigiriam inteligência humana, como interpretar texto, reconhecer imagens ou tomar decisões simples.","verTambem": []},
{"id": "ia-preditiva","termo": "IA preditiva","categoria": "Conceitos e fundamentos","definicao": "Tipo de inteligência artificial que estima resultados futuros ou probabilidades a partir de dados do passado, como prever uma tendência. Diferente da IA generativa, que cria conteúdo. No MPPR, prever a prática de crimes por IA é vedado.","verTambem": ["IA generativa","Escore de risco (risk scoring)"]},
{"id": "inferencia","termo": "Inferência","categoria": "Termos técnicos","definicao": "Momento em que o modelo já treinado é usado para gerar uma resposta. Em termos simples, é a IA \"funcionando\" quando você faz um pedido.","verTambem": ["Modelo de IA"]},
{"id": "input-e-output-entrada-e-saida","termo": "Input e output (entrada e saída)","categoria": "Uso e prompts","definicao": "Input é tudo o que você fornece à ferramenta (o seu comando, um arquivo, uma imagem). Output é a resposta que ela devolve (um texto, um resumo, uma tabela).","verTambem": ["Prompt"]},
{"id": "instrucao-de-sistema-system-prompt","termo": "Instrução de sistema (system prompt)","categoria": "Uso e prompts","definicao": "Conjunto de orientações fixas, definidas por quem configura a ferramenta, que determinam como ela deve se comportar em todas as conversas, antes mesmo do pedido do usuário.","verTambem": ["Engenharia de prompt"]},
{"id": "jailbreak","termo": "Jailbreak","categoria": "Riscos e limites","definicao": "Tentativa de burlar as travas de segurança de uma ferramenta de IA para fazê-la produzir conteúdo que normalmente recusaria.","verTambem": ["Salvaguardas (guardrails)","Prompt injection"]},
{"id": "jus-ia","termo": "Jus IA","categoria": "Ferramentas","definicao": "Ferramenta de inteligência artificial voltada ao trabalho jurídico. Por ser externa, segue a mesma regra de cautela: sem dados institucionais sigilosos.","verTambem": ["Ferramenta externa (não homologada)"]},
{"termo": "Latência","categoria": "Termos técnicos","definicao": "Tempo entre o envio do comando e o começo da resposta. Modelos que raciocinam por etapas e agentes que consultam várias fontes têm latência maior.","verTambem": ["Inferência","Raciocínio estendido (extended thinking)"],"id": "latencia"},
{"id": "lgpd","termo": "LGPD","categoria": "Dados e conformidade","definicao": "Lei Geral de Proteção de Dados. Norma que regula o tratamento de dados pessoais no Brasil e orienta os cuidados ao usar IA com esse tipo de informação.","verTambem": ["Dado pessoal","Dado sensível"]},
{"termo": "Limite de requisições (rate limit)","categoria": "Termos técnicos","definicao": "Teto de pedidos ou de tokens que uma ferramenta aceita em determinado intervalo de tempo. Ao ser atingido, o uso fica bloqueado temporariamente.","verTambem": ["Token","API"],"id": "limite-de-requisicoes-rate-limit"},
{"termo": "Llama","categoria": "Ferramentas","definicao": "Família de modelos de linguagem da Meta, com pesos disponibilizados publicamente, o que permite instalá-los em servidores próprios da instituição.","verTambem": ["Pesos (weights)","Código aberto (open source)"],"id": "llama"},
{"id": "looker-studio","termo": "Looker Studio","categoria": "Ferramentas","definicao": "Ferramenta gratuita do Google para criar painéis e relatórios visuais a partir de dados. Aparece nas aulas de automação e organização de informações.","verTambem": []},
{"termo": "Loop de agente (ciclo do agente)","categoria": "Termos técnicos","definicao": "Ciclo repetido que sustenta um agente: receber o objetivo, escolher uma ação, executar, observar o resultado e decidir o passo seguinte, até concluir a tarefa ou atingir um limite. Definir bem as condições de parada, o número máximo de voltas e os pontos de conferência humana é o que se costuma chamar de engenharia do loop.","verTambem": ["Agente de IA","Harness (arcabouço de execução)","Supervisão humana"],"id": "loop-de-agente-ciclo-do-agente"},
{"id": "marca-d-agua-watermark","termo": "Marca d'água (watermark)","categoria": "Riscos e limites","definicao": "Sinal, muitas vezes invisível, inserido em um conteúdo gerado por IA para indicar sua origem artificial.","verTambem": ["Deepfake"]},
{"id": "markdown","termo": "Markdown","categoria": "Uso e prompts","definicao": "Forma simples de formatar texto usando sinais no meio das palavras, como asteriscos para negrito e o símbolo \"#\" para títulos. As ferramentas de IA costumam responder nesse formato; ao colar em um editor comum, os sinais podem aparecer literalmente e precisam ser ajustados.","verTambem": []},
{"termo": "MCP (Protocolo de Contexto de Modelo)","categoria": "Termos técnicos","definicao": "Padrão aberto que descreve como ferramentas de IA se conectam a fontes de dados e sistemas externos, de modo que a mesma integração sirva a diferentes assistentes. Do inglês Model Context Protocol.","verTambem": ["Chamada de ferramentas (function calling)","API","Plugin (extensão)"],"id": "mcp-protocolo-de-contexto-de-modelo"},
{"termo": "Midjourney","categoria": "Ferramentas","definicao": "Ferramenta de geração de imagens a partir de descrições em texto. É externa, e o uso do resultado exige atenção aos direitos autorais.","verTambem": ["Nano Banana","Direitos autorais e IA"],"id": "midjourney"},
{"termo": "Mistral","categoria": "Ferramentas","definicao": "Empresa francesa de inteligência artificial e a família de modelos que desenvolve, parte deles com pesos abertos.","verTambem": ["Código aberto (open source)","Pesos (weights)"],"id": "mistral"},
{"termo": "Modelo de fronteira (frontier model)","categoria": "Conceitos e fundamentos","definicao": "Os modelos mais avançados disponíveis em determinado momento, no limite da capacidade técnica atual. A composição dessa lista muda a cada poucos meses.","verTambem": ["Modelo fundacional (foundation model)","Benchmark"],"id": "modelo-de-fronteira-frontier-model"},
{"id": "modelo-de-ia","termo": "Modelo de IA","categoria": "Conceitos e fundamentos","definicao": "Nome técnico do sistema de IA já treinado e pronto para uso. Quando você usa o Gemini ou o ChatGPT, está usando um modelo por trás da tela.","verTambem": ["Modelo de linguagem (LLM)","Modelo fundacional (foundation model)"]},

  var ALFABETO = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  var DIACRITICOS = /[\u0300-\u036f]/g;

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function semAcento(s){
    return String(s).normalize("NFD").replace(DIACRITICOS,"").toLowerCase();
  }
  function slug(s){
    return semAcento(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  }

  /* Normaliza guardando, para cada caractere normalizado, o indice no texto
     original. Permite destacar o trecho encontrado sem perder os acentos. */
  var cacheNorm = {};
  function normMapa(texto){
    if(Object.prototype.hasOwnProperty.call(cacheNorm, texto)) return cacheNorm[texto];
    var chars = [], mapa = [];
    for(var i=0;i<texto.length;i++){
      var n = texto.charAt(i).normalize("NFD").replace(DIACRITICOS,"").toLowerCase();
      for(var k=0;k<n.length;k++){ chars.push(n.charAt(k)); mapa.push(i); }
    }
    var r = { norm: chars.join(""), mapa: mapa };
    cacheNorm[texto] = r;
    return r;
  }

  function destacarTexto(texto, termos){
    if(!termos.length) return esc(texto);
    var nm = normMapa(texto), faixas = [], t, i, j;
    for(j=0;j<termos.length;j++){
      t = termos[j];
      if(!t) continue;
      i = nm.norm.indexOf(t);
      while(i > -1){
        faixas.push([nm.mapa[i], nm.mapa[i + t.length - 1] + 1]);
        i = nm.norm.indexOf(t, i + 1);
      }
    }
    if(!faixas.length) return esc(texto);
    faixas.sort(function(a,b){ return a[0] - b[0]; });
    var juntas = [];
    for(var f=0;f<faixas.length;f++){
      var ult = juntas[juntas.length-1];
      if(ult && faixas[f][0] <= ult[1]){ ult[1] = Math.max(ult[1], faixas[f][1]); }
      else { juntas.push([faixas[f][0], faixas[f][1]]); }
    }
    var saida = "", pos = 0;
    for(var g=0;g<juntas.length;g++){
      saida += esc(texto.slice(pos, juntas[g][0])) +
               "<mark>" + esc(texto.slice(juntas[g][0], juntas[g][1])) + "</mark>";
      pos = juntas[g][1];
    }
    return saida + esc(texto.slice(pos));
  }

  function primeiraLetra(termo){
    var c = semAcento(termo).charAt(0).toUpperCase();
    return /[A-Z]/.test(c) ? c : "#";
  }

  var elLimpar     = document.getElementById("limpar");
  var elChips      = document.getElementById("chips");
  var elIndice     = document.getElementById("indice");
  var elContador   = document.getElementById("contador");
  var elLimparTudo = document.getElementById("limparFiltros");
  var elVoltarTopo = document.getElementById("voltarTopo");
  var btModoAZ     = document.getElementById("modoAZ");
  var btModoCat    = document.getElementById("modoCat");

  var reduzirMovimento = !!(window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  (function montarChips(){
    var html = '<button type="button" class="chip" data-cat="__todas" aria-pressed="true">Todas</button>';
    CATEGORIAS.forEach(function(c){
      html += '<button type="button" class="chip" data-cat="' + esc(c) + '" aria-pressed="false">' + esc(c) + '</button>';
    });
    elChips.innerHTML = html;
  })();

  (function montarIndice(){
    var html = "";
    ALFABETO.forEach(function(l){
      html += '<button type="button" class="letra" data-letra="' + l + '" aria-label="Ir para a letra ' + l + '">' + l + '</button>';
    });
    elIndice.innerHTML = html;
  })();

  function termosBusca(){
    var q = semAcento(estado.busca).trim();
    if(!q) return [];
    return q.split(/\s+/).filter(Boolean);
  }

  function visiveis(){
    var termos = termosBusca();
    return DADOS.filter(function(d){
      if(estado.cats.length && estado.cats.indexOf(d.categoria) === -1) return false;
      for(var i=0;i<termos.length;i++){
        if(d._busca.indexOf(termos[i]) === -1) return false;
      }
      return true;
    });
  }

  function htmlVerTambem(item){
    if(!item.verTambem || !item.verTambem.length) return "";
    var partes = item.verTambem.map(function(nome){
      var alvo = slug(nome);
      if(PORID[alvo]){
        return '<a href="#' + alvo + '" class="ref" data-alvo="' + alvo + '">' + esc(nome) + "</a>";
      }
      return '<span class="sem-link">' + esc(nome) + "</span>";
    });
    return '<p class="ver"><span class="rot">Ver também:</span>' + partes.join(", ") + "</p>";
  }

  function htmlVerbete(item, termos){
    return '<article class="verbete" id="' + item.id + '" data-letra="' + item._letra + '" tabindex="-1">' +
             '<div class="cab-verbete">' +
               '<h3><a class="titulo" href="#' + item.id + '">' + destacarTexto(item.termo, termos) +
                 '<span class="ancora" aria-hidden="true">#</span></a></h3>' +
               '<span class="selo cat-' + item._catSlug + '">' + esc(item.categoria) + "</span>" +
             "</div>" +
             '<p class="def">' + destacarTexto(item.definicao, termos) + "</p>" +
             htmlVerTambem(item) +
           "</article>";
  }

  function htmlGrupo(titulo, itens, termos, classe, idGrupo){
    var html = '<section class="grupo ' + classe + '" id="' + idGrupo + '">' +
               '<div class="cab-grupo"><h2>' + esc(titulo) + "</h2>" +
               '<span class="qtd">' + itens.length + (itens.length === 1 ? " termo" : " termos") + "</span></div>";
    itens.forEach(function(it){ html += htmlVerbete(it, termos); });
    return html + "</section>";
  }

  function renderizar(){
    var lista = visiveis();
    var termos = termosBusca();
    var html = "";

    if(!lista.length){
      html = '<div class="vazio">' +
               "<h2>Nenhum termo encontrado</h2>" +
               "<p>Tente outra palavra ou limpe a busca e os filtros de categoria.</p>" +
               '<button type="button" class="botao" data-acao="limpar-tudo">Limpar filtros</button>' +
             "</div>";
    } else if(estado.modo === "az"){
      var porLetra = {};
      lista.forEach(function(d){
        if(!porLetra[d._letra]) porLetra[d._letra] = [];
        porLetra[d._letra].push(d);
      });
      Object.keys(porLetra).sort().forEach(function(l){
        html += htmlGrupo(l, porLetra[l], termos, "grupo-az", "letra-" + l);
      });
    } else {
      CATEGORIAS.forEach(function(c){
        var itens = lista.filter(function(d){ return d.categoria === c; });
        if(itens.length) html += htmlGrupo(c, itens, termos, "grupo-cat", "cat-" + slug(c));
      });
    }

    elLista.innerHTML = html;
    elContador.innerHTML = "Mostrando <b>" + lista.length + "</b> de <b>" + TOTAL + "</b> termos";

    var letrasVisiveis = {};
    lista.forEach(function(d){ letrasVisiveis[d._letra] = true; });
    var botoes = elIndice.querySelectorAll(".letra");
    for(var i=0;i<botoes.length;i++){
      var ativa = !!letrasVisiveis[botoes[i].getAttribute("data-letra")];
      botoes[i].disabled = !ativa;
      botoes[i].setAttribute("aria-disabled", ativa ? "false" : "true");
    }

    var temFiltro = !!estado.busca || estado.cats.length > 0;
    elLimparTudo.hidden = !temFiltro;
    elLimpar.hidden = !estado.busca;
  }

  function alturaIndice(){
    var n = document.querySelector(".indice");
    return n ? n.offsetHeight + 8 : 8;
  }

  function rolarAte(el, deslocamento){
    var alvo = el.getBoundingClientRect().top - elScroller.getBoundingClientRect().top +
               elScroller.scrollTop - (deslocamento || 0);
    if(alvo < 0) alvo = 0;
    if(elScroller.scrollTo){
      try{
        elScroller.scrollTo({ top: alvo, behavior: reduzirMovimento ? "auto" : "smooth" });
        return;
      }catch(e){}
    }
    elScroller.scrollTop = alvo;
  }

  var timerDestaque = null;
  function destacar(el){
    var anterior = elLista.querySelector(".verbete.destacado");
    if(anterior) anterior.classList.remove("destacado");
    if(timerDestaque) clearTimeout(timerDestaque);
    el.classList.add("destacado");
    timerDestaque = setTimeout(function(){ el.classList.remove("destacado"); }, 2000);
  }

  function atualizarChips(){
    var chips = elChips.querySelectorAll(".chip");
    for(var i=0;i<chips.length;i++){
      var c = chips[i].getAttribute("data-cat");
      var ativo = (c === "__todas") ? estado.cats.length === 0 : estado.cats.indexOf(c) > -1;
      chips[i].setAttribute("aria-pressed", ativo ? "true" : "false");
    }
  }

  function limparFiltros(){
    estado.busca = "";
    estado.cats = [];
    elBusca.value = "";
    atualizarChips();
    renderizar();
  }

  var ignorarHash = false;
  function definirHash(id){
    ignorarHash = true;
    try{
      if(window.history && window.history.replaceState){
        window.history.replaceState(null, "", "#" + id);
      } else {
        window.location.hash = id;
      }
    }catch(e){
      try{ window.location.hash = id; }catch(e2){}
    }
    setTimeout(function(){ ignorarHash = false; }, 60);
  }

  function irPara(id, comHash){
    if(!PORID[id]) return;
    if(!document.getElementById(id)) limparFiltros();
    var el = document.getElementById(id);
    if(!el) return;
    rolarAte(el, alturaIndice());
    destacar(el);
    if(el.focus){ try{ el.focus({ preventScroll:true }); }catch(e){} }
    if(comHash) definirHash(id);
  }

  function maisProximo(alvo, seletor){
    var n = alvo;
    while(n && n.nodeType === 1){
      if(n.matches && n.matches(seletor)) return n;
      n = n.parentElement;
    }
    return null;
  }

  elBusca.addEventListener("input", function(){
    estado.busca = elBusca.value;
    renderizar();
    elScroller.scrollTop = 0;
  });
  elBusca.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && elBusca.value){
      ev.preventDefault();
      elBusca.value = ""; estado.busca = "";
      renderizar();
    }
  });
  elLimpar.addEventListener("click", function(){
    elBusca.value = ""; estado.busca = "";
    renderizar(); elBusca.focus();
  });

  elChips.addEventListener("click", function(ev){
    var b = maisProximo(ev.target, ".chip");
    if(!b) return;
    var c = b.getAttribute("data-cat");
    if(c === "__todas"){ estado.cats = []; }
    else{
      var i = estado.cats.indexOf(c);
      if(i > -1) estado.cats.splice(i, 1); else estado.cats.push(c);
    }
    atualizarChips(); renderizar(); elScroller.scrollTop = 0;
  });

  function definirModo(m){
    if(estado.modo === m) return;
    estado.modo = m;
    btModoAZ.setAttribute("aria-pressed", m === "az" ? "true" : "false");
    btModoCat.setAttribute("aria-pressed", m === "cat" ? "true" : "false");
    renderizar(); elScroller.scrollTop = 0;
  }
  btModoAZ.addEventListener("click", function(){ definirModo("az"); });
  btModoCat.addEventListener("click", function(){ definirModo("cat"); });

  elIndice.addEventListener("click", function(ev){
    var b = maisProximo(ev.target, ".letra");
    if(!b || b.disabled) return;
    var letra = b.getAttribute("data-letra");
    var alvo = document.getElementById("letra-" + letra);
    if(!alvo) alvo = elLista.querySelector('.verbete[data-letra="' + letra + '"]');
    if(alvo) rolarAte(alvo, alturaIndice());
  });

  elLista.addEventListener("click", function(ev){
    var ref = maisProximo(ev.target, "a.ref");
    if(ref){ ev.preventDefault(); irPara(ref.getAttribute("data-alvo"), true); return; }
    var titulo = maisProximo(ev.target, "a.titulo");
    if(titulo){
      ev.preventDefault();
      var art = maisProximo(titulo, ".verbete");
      if(art){ definirHash(art.id); rolarAte(art, alturaIndice()); destacar(art); }
      return;
    }
    if(maisProximo(ev.target, '[data-acao="limpar-tudo"]')){ limparFiltros(); elBusca.focus(); }
  });

  elLimparTudo.addEventListener("click", function(){
    limparFiltros(); elScroller.scrollTop = 0; elBusca.focus();
  });

  elVoltarTopo.addEventListener("click", function(){
    if(elScroller.scrollTo){
      try{ elScroller.scrollTo({ top:0, behavior: reduzirMovimento ? "auto" : "smooth" }); }
      catch(e){ elScroller.scrollTop = 0; }
    } else { elScroller.scrollTop = 0; }
    elBusca.focus();
  });

  elScroller.addEventListener("scroll", function(){
    if(elScroller.scrollTop > 260) elVoltarTopo.classList.add("visivel");
    else elVoltarTopo.classList.remove("visivel");
  });

  window.addEventListener("hashchange", function(){
    if(ignorarHash) return;
    var id = "";
    try{ id = (window.location.hash || "").replace(/^#/, ""); }catch(e){}
    if(id && PORID[id]) irPara(id, false);
  });

  atualizarChips();
  renderizar();

  (function abrirAncoraInicial(){
    var id = "";
    try{ id = (window.location.hash || "").replace(/^#/, ""); }catch(e){}
    if(id && PORID[id]) setTimeout(function(){ irPara(id, false); }, 80);
  })();

})();
</script>
</body>
</html>
